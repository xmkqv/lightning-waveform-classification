[project]
name = "waveform-classification"
version = "0.1.0"
description = "Benchmark neural architectures for lightning waveform classification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
keywords = ["lightning", "machine-learning", "pytorch", "waveform-classification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "attrs>=25.3.0",
    "einops>=0.8.1",
    "jinja2>=3.1.6",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "pydantic>=2.12.5",
    "pytorch-lightning>=2.5.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "scikit-learn>=1.7.1",
    "tensorboard>=2.18.0",
    "torch>=2.9.1",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.8.2",
    "tyro>=0.9.35",
    "visualtorch>=0.2.4",
]

[project.urls]
Repository = "https://github.com/xmkqv/lightning-waveform-classification"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waveform_classification"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=waveform_classification --cov-report=term --cov-report=html"
cache_dir = ".cache/pytest"


[tool.coverage.run]
data_file = ".cache/.coverage"

[tool.coverage.html]
directory = ".cache/htmlcov"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-reportlog>=1.0.0",
    "ruff>=0.14.5",
]
